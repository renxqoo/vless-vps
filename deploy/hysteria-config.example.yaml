listen: :2096

tls:
  cert: /etc/xray-certs/fullchain.pem
  key: /etc/xray-certs/privkey.pem

obfs:
  type: salamander
  salamander:
    password: HY2_OBFS_PLACEHOLDER

auth:
  type: password
  password: HY2_AUTH_PLACEHOLDER

masquerade:
  type: proxy
  proxy:
    url: https://www.bing.com/
    rewriteHost: true

# Reject before direct; HOST_IP_CIDR_PLACEHOLDER is this VPS IP /32 (or /128).
acl:
  inline:
    - reject(0.0.0.0/8)
    - reject(10.0.0.0/8)
    - reject(100.64.0.0/10)
    - reject(127.0.0.0/8)
    - reject(169.254.0.0/16)
    - reject(172.16.0.0/12)
    - reject(192.0.0.0/24)
    - reject(192.0.2.0/24)
    - reject(192.88.99.0/24)
    - reject(192.168.0.0/16)
    - reject(198.18.0.0/15)
    - reject(198.51.100.0/24)
    - reject(203.0.113.0/24)
    - reject(224.0.0.0/4)
    - reject(240.0.0.0/4)
    - reject(::/96)
    - reject(64:ff9b::/96)
    - reject(64:ff9b:1::/48)
    - reject(100::/64)
    - reject(2001::/32)
    - reject(2001:10::/28)
    - reject(2001:20::/28)
    - reject(2001:db8::/32)
    - reject(2002::/16)
    - reject(fc00::/7)
    - reject(fe80::/10)
    - reject(fec0::/10)
    - reject(ff00::/8)
    - reject(HOST_IP_CIDR_PLACEHOLDER)
    - reject(suffix:localhost)
    - reject(suffix:local)
    - reject(suffix:internal)
    - direct(all)
